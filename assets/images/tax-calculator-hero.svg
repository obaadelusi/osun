<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A calculator showing naira with a rising bar chart and percentage badge">
  <rect width="480" height="360" rx="8" fill="#e5f1ea"/>
  <circle cx="90" cy="70" r="90" fill="#cfe5d8"/>
  <circle cx="440" cy="320" r="110" fill="#cfe5d8"/>
  <!-- bars -->
  <g transform="translate(300 90)">
    <rect x="0" y="130" width="34" height="80" rx="3" fill="#00703c"/>
    <rect x="46" y="90" width="34" height="120" rx="3" fill="#00703c"/>
    <rect x="92" y="50" width="34" height="160" rx="3" fill="#0f3b26"/>
    <rect x="-8" y="210" width="144" height="4" rx="2" fill="#0f3b26"/>
    <path d="M17 112 L63 72 L109 30" fill="none" stroke="#f2b705" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="109" cy="30" r="8" fill="#f2b705"/>
  </g>
  <!-- calculator -->
  <g transform="translate(70 40)">
    <rect width="190" height="280" rx="16" fill="#0f3b26"/>
    <rect x="16" y="18" width="158" height="62" rx="8" fill="#e5f1ea"/>
    <text x="164" y="64" text-anchor="end" font-family="Noto Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f3b26">₦416,400</text>
    <g fill="#00703c">
      <rect x="16" y="98" width="34" height="34" rx="6"/><rect x="60" y="98" width="34" height="34" rx="6"/>
      <rect x="104" y="98" width="34" height="34" rx="6"/>
      <rect x="16" y="142" width="34" height="34" rx="6"/><rect x="60" y="142" width="34" height="34" rx="6"/>
      <rect x="104" y="142" width="34" height="34" rx="6"/>
      <rect x="16" y="186" width="34" height="34" rx="6"/><rect x="60" y="186" width="34" height="34" rx="6"/>
      <rect x="104" y="186" width="34" height="34" rx="6"/>
      <rect x="16" y="230" width="78" height="34" rx="6"/><rect x="104" y="230" width="34" height="34" rx="6"/>
    </g>
    <g fill="#f2b705">
      <rect x="148" y="98" width="26" height="78" rx="6"/><rect x="148" y="186" width="26" height="78" rx="6"/>
    </g>
  </g>
  <!-- percent badge -->
  <g transform="translate(270 40)">
    <circle cx="40" cy="40" r="38" fill="#f2b705"/>
    <text x="40" y="52" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f3b26">%</text>
  </g>
</svg>
