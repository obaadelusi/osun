<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="An official birth certificate with a gold seal, baby footprints, and digital verification badge">
  <!-- Background card -->
  <path d="M8 0h464a8 8 0 0 1 8 8v344a8 8 0 0 1-8 8H8a8 8 0 0 1-8-8V8a8 8 0 0 1 8-8z" fill="#e5f1ea"/>
  <!-- Decorative soft circles -->
  <path d="M400 70m-90 0a90 90 0 1 0 180 0a90 90 0 1 0-180 0" fill="#cfe5d8"/>
  <path d="M75 315m-105 0a105 105 0 1 0 210 0a105 105 0 1 0-210 0" fill="#cfe5d8"/>

  <!-- Left card: Hospital / PHC Clinic icon -->
  <g transform="translate(36 136)">
    <path d="M12 36h96a8 8 0 0 1 8 8v92H4V44a8 8 0 0 1 8-8z" fill="#0f3b26"/>
    <path d="M36 12h48a6 6 0 0 1 6 6v18H30V18a6 6 0 0 1 6-6z" fill="#00703c"/>
    <!-- Medical cross -->
    <path d="M55 18h10v8h8v10h-8v8H55v-8h-8V26h8z" fill="#f2b705"/>
    <!-- Windows & door -->
    <path d="M20 56h18v18H20zm31 0h18v18H51zm31 0h18v18H82zM20 86h18v18H20zm62 0h18v18H82z" fill="#cfe5d8"/>
    <path d="M48 92h24v44H48z" fill="#00703c"/>
    <path d="M0 134h120v8H0z" fill="#00703c"/>
  </g>

  <!-- Main Certificate of Birth Document -->
  <g transform="translate(148 28)">
    <!-- Document shadow -->
    <path d="M22 10h196a12 12 0 0 1 12 12v276a12 12 0 0 1-12 12H22a12 12 0 0 1-12-12V22a12 12 0 0 1 12-12z" fill="#b8d5c5"/>
    <!-- Document outer frame -->
    <path d="M16 4h196a12 12 0 0 1 12 12v276a12 12 0 0 1-12 12H16a12 12 0 0 1-12-12V16A12 12 0 0 1 16 4z" fill="#0f3b26"/>
    <!-- Document inner paper -->
    <path d="M26 16h176a6 6 0 0 1 6 6v256a6 6 0 0 1-6 6H26a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6z" fill="#ffffff"/>
    <!-- Top green header band -->
    <path d="M26 16h176a6 6 0 0 1 6 6v30H20V22a6 6 0 0 1 6-6z" fill="#00703c"/>
    <!-- Nigerian flag emblem inside header -->
    <path d="M34 25h8v12h-8z" fill="#0f3b26"/>
    <path d="M42 25h8v12h-8z" fill="#ffffff"/>
    <path d="M50 25h8v12h-8z" fill="#0f3b26"/>
    <!-- Header title bars -->
    <path d="M68 26h96v5H68zm0 9h64v4H68z" fill="#ffffff"/>

    <!-- Baby footprints emblem in centre circle -->
    <path d="M114 92m-28 0a28 28 0 1 0 56 0a28 28 0 1 0-56 0" fill="#e5f1ea"/>
    <!-- Left footprint -->
    <path d="M105 97c-4 0-6.5-4.5-5.5-10.5s3-9.5 6.5-9c3.5.5 5 4.5 4 10.5s-1.5 9-5 9zm-4.5-22.5a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0zm5-1.5a1.9 1.9 0 1 0 3.8 0a1.9 1.9 0 1 0-3.8 0zm4.2 1a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0z" fill="#00703c"/>
    <!-- Right footprint -->
    <path d="M123 103c3.5 0 6-4.5 5-10.5s-3-9.5-6.5-9c-3.5.5-5 4.5-4 10.5s2 9 5.5 9zm4.5-22.5a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0zm-4.8-1.5a1.9 1.9 0 1 0 3.8 0a1.9 1.9 0 1 0-3.8 0zm-4.2 1a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0z" fill="#00703c"/>

    <!-- Certificate title & text lines -->
    <path d="M58 132h112v8a4 4 0 0 1-4 4H62a4 4 0 0 1-4-4v-8z" fill="#0f3b26"/>
    <path d="M40 156h148v6H40zm0 16h148v6H40zm0 16h116v6H40zm0 16h136v6H40z" fill="#d0d4d1"/>
    <!-- Divider line -->
    <path d="M40 224h148v2H40z" fill="#d0d4d1"/>

    <!-- QR Verification block on bottom left -->
    <path d="M40 236h32v32H40z" fill="#0f3b26"/>
    <path d="M44 240h10v10H44zm14 0h10v10H58zm-14 14h10v10H44zm16 2h6v6h-6z" fill="#ffffff"/>
    <path d="M80 242h52v6H80zm0 12h38v5H80z" fill="#00703c"/>

    <!-- Gold Official Seal & Ribbons on bottom right -->
    <path d="M162 258l-8 24 12-6 8 8 6-24z" fill="#c99700"/>
    <path d="M174 258l8 24-12-6-8 8-6-24z" fill="#00703c"/>
    <path d="M168 246m-20 0a20 20 0 1 0 40 0a20 20 0 1 0-40 0" fill="#f2b705"/>
    <path d="M168 246m-14 0a14 14 0 1 0 28 0a14 14 0 1 0-28 0" fill="#ffd34d"/>
    <path d="M162 246l4 4 9-9" fill="none" stroke="#0f3b26" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right floating badge: Verified NIN / e-CRVS checkmark -->
  <g transform="translate(352 72)">
    <path d="M44 0a44 44 0 1 0 0 88a44 44 0 1 0 0-88z" fill="#f2b705"/>
    <path d="M44 8a36 36 0 1 0 0 72a36 36 0 1 0 0-72z" fill="#ffd34d"/>
    <path d="M28 45l11 11 22-24" fill="none" stroke="#0f3b26" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom right badge: 60 Days Free Statutory Window -->
  <g transform="translate(346 218)">
    <path d="M10 0h84a10 10 0 0 1 10 10v68a10 10 0 0 1-10 10H10A10 10 0 0 1 0 78V10A10 10 0 0 1 10 0z" fill="#0f3b26"/>
    <path d="M10 0h84a10 10 0 0 1 10 10v14H0V10A10 10 0 0 1 10 0z" fill="#00703c"/>
    <path d="M24 6h56v6H24z" fill="#f2b705"/>
    <!-- "FREE" / 0 Naira representation bars -->
    <path d="M22 38h60v10H22zm8 18h44v8H30z" fill="#ffffff"/>
    <path d="M20 72h64v6H20z" fill="#f2b705"/>
  </g>
</svg>
